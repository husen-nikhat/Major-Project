<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Digital Event Management System</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <!-- LOGO -->
            <img src="../image/logo1.png"
                 class="event-logo"
                 alt="Digital Event Management System">

            <h1>Welcome Back</h1>

            <p class="login-text">
                Login to access your account
            </p>


            <!-- LOGIN FORM -->
            <form id="loginForm">

                <!-- EMAIL -->
                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- PASSWORD -->
                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <span onclick="togglePassword()">
                        👁
                    </span>

                </div>


                <!-- OPTIONS -->
                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="login-submit">

                    Login

                </button>

            </form>


            <!-- OR -->
            <div class="or">
                <span>OR</span>
            </div>


            <!-- GOOGLE LOGIN -->
            <button
                type="button"
                class="google-login">

                <img
                    src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                    alt="Google">

                <span>
                    Continue with Google
                </span>

            </button>


            <!-- REGISTER -->
            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>


            <!-- HOME -->
            <a
                href="../index.html"
                class="back-home">

                ← Back to Home

            </a>

        </div>

    </div>



    <!-- ===== JAVASCRIPT ===== -->

    <script>

        // Show / Hide Password

        function togglePassword() {

            const password =
                document.getElementById("password");

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";

            }

        }



        // Login Form

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value.trim();


                // Basic frontend validation

                if (email === "" || password === "") {

                    alert("Please enter your email and password.");

                    return;

                }


                // Temporary frontend login

                window.location.href =
                    "user/dashboard.html";

            });

    </script>

</body>

</html>
